name: BuildAndRunTests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
    - src/**
  pull_request:
    branches: [ "main" ]
    paths:
    - src/**
    
jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Fail loudly if the vendored embedding model is missing, rather than silently
      # falling back to downloading it from HuggingFace. See models/README.md.
      LOTTA_REQUIRE_LOCAL_MODEL: '1'

    steps:
    - name: Checkout LottaDB.slnx
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x

    # The vector-search tests need an ONNX embedding model. Fetch it from our own release
    # asset rather than HuggingFace, which rate-limited CI (429) and failed the build.
    # Cached, so it is usually not downloaded at all. See models/README.md.
    - name: Cache test model
      id: cache-test-model
      uses: actions/cache@v4
      with:
        path: models/bge-micro-v2
        key: test-model-bge-micro-v2-test-assets-v1

    - name: Fetch test model
      if: steps.cache-test-model.outputs.cache-hit != 'true'
      run: bash scripts/fetch-test-model.sh

    - name: Restore dependencies
      run: dotnet restore src/LottaDB.slnx

    - name: Build
      run: dotnet build --no-restore src/LottaDB.slnx --property WarningLevel=0
      
    - name: Test Memory
      run: dotnet test --no-build --verbosity normal src/LottaDB.Memory.Tests/LottaDB.Memory.Tests.csproj

    - name: Test SQLite
      run: dotnet test --no-build --verbosity normal src/LottaDB.SQLite.Tests/LottaDB.SQLite.Tests.csproj

